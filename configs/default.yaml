# Shared settings for every run. Change values here, not inside scripts,
# so all four runs (A, B, C, D) use the same protocol.

model: Qwen/Qwen2.5-Coder-0.5B-Instruct
seed: 0

data:
  dataset: google-research-datasets/mbpp
  config: full              # 374 train, 90 validation, 500 test, 10 prompt
  heldout_size: 150         # taken from train+validation, used for tuning only.
                            # 60 gave a +/-12.6 point 95% CI, too wide to tune with.
  splits_file: data/splits.json

prompt:
  # The model sees this many tests in the prompt; the sandbox checks all 3.
  n_shown_tests: 1

generation:
  backend: auto             # auto | vllm | hf
  max_new_tokens: 512
  batch_size: 32            # hf backend only
  eval:                     # greedy decoding for every evaluation
    temperature: 0.0
  sample:                   # sampling for self-training data (later tasks)
    n: 8
    temperature: 0.8
    top_p: 0.95

selftrain:
  max_per_problem: 4        # distinct solutions kept per problem (Runs B and C)

# LoRA fine-tuning. Every run starts from the base model above. Tune
# learning_rate and epochs on heldout with Run D (task 18), then use the
# same values for B and C so the runs differ only in their data.
train:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  learning_rate: 5.0e-4       # task 18: best of the 12-setting grid on heldout (results/D_tune)
  epochs: 2
  batch_size: 4             # 8 needs about 12 GB for the logits alone at long prompts
  grad_accum: 4             # effective batch 16
  warmup_ratio: 0.05
  max_length: 1024          # prompt + response tokens

sandbox:
  timeout_s: 5              # CPU seconds per program (wall-clock backstop is 3x + 2s)
  memory_mb: 1024
  workers: 0                # 0 = one per CPU

# Results are committed to the repo under results/. In Colab, pass
# --output-dir with a Google Drive folder while running (survives disconnects);
# the notebook's last cell copies them into results/ and pushes.
output_dir: results

# Fine-tuned models (about 1 GB each). Not committed; in Colab use /content/models.
model_dir: checkpoints
